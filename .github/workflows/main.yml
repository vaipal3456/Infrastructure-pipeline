
name: Terraform Azure Infra Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # STAGE 1: SECURITY SCAN, VALIDATE AND PLAN
  Terraform-Validate-Plan:

    name: Security Scan & Plan
    runs-on: ubuntu-latest
    environment: test

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.0

      # Security scanning
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: ./root
          soft_fail: true

      # Azure authentication using OIDC
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform installation
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: ./root

      # Validate Terraform code
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./root

      # Generate Terraform Plan
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: ./root

      # Upload plan artifact
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: root/tfplan
          retention-days: 1


  # STAGE 2: PRODUCTION DEPLOYMENT
  Terraform-Deploy:

    name: Infrastructure Apply
    runs-on: ubuntu-latest
    environment: production

    needs: Terraform-Validate-Plan

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.0

      # Azure authentication
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Download plan from previous job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: root

      # Install same Terraform version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: ./root

      # Apply previously generated plan
      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        working-directory: ./root

      - name: Terraform Apply
        run: terraform apply --auto-approve
        working-directory: ./root
